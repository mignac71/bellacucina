<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Fiszki do nauki włoskiego słownictwa kulinarnego. Ucz się składników po włosku z systemem powtórek." />
    <meta name="keywords" content="fiszki włoskie, nauka słówek, składniki po włosku, flashcards" />
    <meta name="theme-color" content="#009246" />
    <title>Fiszki – Bella Cucina</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-dH9z5c6BAV5lpZdscOSgnUUuY+2r78JFG6ESZsCp2BGhj9x4t3iPza6ArVHMV0Pux+uAoH+g9oKSM8d1Ji4EVw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <nav class="top-nav" role="navigation" aria-label="Główna nawigacja">
        <a href="index.html" aria-label="Strona główna"><img src="images/home.png" alt="Strona główna" /></a>
        <a href="recipes.html">Przepisy</a>
        <a href="flashcards.html">Fiszki</a>
        <a href="game.html">Gry</a>
        <div class="theme-toggle" id="theme-toggle" role="button" aria-label="Przełącz tryb ciemny" tabindex="0">
            <span class="theme-toggle-icon">☀️</span>
            <div class="theme-toggle-switch"></div>
        </div>
    </nav>
    <header class="hero small-hero">
        <img src="images/fiszki_big.jpg" alt="Fiszki" class="hero-img" loading="lazy" />
    </header>

    <!-- Progress display -->
    <div class="progress-container" id="progress-display" aria-label="Twój postęp nauki">
    </div>

    <main class="container">
        <section class="flashcards-container" id="flashcards-container">
            <div class="flashcard-progress" id="flashcard-progress">
                Ładowanie fiszek...
            </div>

            <div class="flashcard-wrapper" id="flashcard-wrapper">
                <div class="flashcard" id="flashcard">
                    <div class="flashcard-front">
                        <div class="flashcard-word" id="flashcard-front-word">-</div>
                        <div class="flashcard-hint">🇮🇹 Kliknij, aby zobaczyć tłumaczenie</div>
                    </div>
                    <div class="flashcard-back">
                        <div class="flashcard-word" id="flashcard-back-word">-</div>
                        <div class="flashcard-hint">🇵🇱 Tłumaczenie polskie</div>
                    </div>
                </div>
            </div>

            <div class="flashcard-controls">
                <button class="flashcard-btn dont-know" id="btn-dont-know" aria-label="Nie znam tego słowa">
                    <i class="fas fa-times"></i> Nie znam
                </button>
                <button class="flashcard-btn know" id="btn-know" aria-label="Znam to słowo">
                    <i class="fas fa-check"></i> Znam
                </button>
            </div>

            <div class="game-mode-selector">
                <button class="mode-btn active" data-mode="all">Wszystkie</button>
                <button class="mode-btn" data-mode="difficult">Trudne</button>
                <button class="mode-btn" data-mode="new">Nowe</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Bella Cucina – Ucz się włoskiego i odkrywaj smak Italii.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/flashcards.js"></script>
    <script>
        fetch('data/recipes.json')
            .then((res) => res.json())
            .then((data) => {
                window.recipesData = data;
                if (typeof initFlashcards === 'function') {
                    initFlashcards();
                }
            })
            .catch((err) => console.error('Błąd ładowania danych:', err));
    </script>
</body>

</html>
