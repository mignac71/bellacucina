<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Gry edukacyjne do nauki języka włoskiego przez gotowanie. Memory, quiz tłumaczeniowy, symulacja restauracji." />
  <meta name="keywords" content="gry edukacyjne, nauka włoskiego, quiz, memory, restauracja po włosku" />
  <meta name="theme-color" content="#009246" />
  <title>Gry – Bella Cucina</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-dH9z5c6BAV5lpZdscOSgnUUuY+2r78JFG6ESZsCp2BGhj9x4t3iPza6ArVHMV0Pux+uAoH+g9oKSM8d1Ji4EVw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <nav class="top-nav" role="navigation" aria-label="Główna nawigacja">
    <a href="index.html" aria-label="Strona główna"><img src="images/home.png" alt="Strona główna" /></a>
    <a href="recipes.html">Przepisy</a>
    <a href="flashcards.html">Fiszki</a>
    <a href="game.html">Gry</a>
    <div class="theme-toggle" id="theme-toggle" role="button" aria-label="Przełącz tryb ciemny" tabindex="0">
      <span class="theme-toggle-icon">☀️</span>
      <div class="theme-toggle-switch"></div>
    </div>
  </nav>
  <header class="hero small-hero">
    <img src="images/gry_big.jpg" alt="Gry" class="hero-img" loading="lazy" />
  </header>

  <!-- Progress display -->
  <div class="progress-container" id="progress-display" aria-label="Twój postęp nauki">
  </div>

  <main class="container">
    <section class="game-controls">
      <div class="player-select">
        <div id="player-options"></div>
        <div class="add-player">
          <input type="text" id="new-player-name" placeholder="Twój nick" aria-label="Wprowadź nick gracza" />
          <button id="add-player-btn">Dołącz</button>
        </div>
      </div>
      <div class="game-select" role="list" aria-label="Wybierz grę">
        <div class="game-card" data-game="memory" role="listitem">
          <img src="images/memory_game.jpg" alt="Gra pamięciowa - dopasuj pary słów" loading="lazy" />
        </div>
        <div class="game-card" data-game="ingredients" role="listitem">
          <img src="images/skladniki_game.jpg" alt="Dobierz składniki do przepisu" loading="lazy" />
        </div>
        <div class="game-card" data-game="translation" role="listitem">
          <img src="images/tlumacz_game.jpg" alt="Quiz tłumaczeniowy" loading="lazy" />
        </div>
        <div class="game-card" data-game="marathon" role="listitem">
          <img src="images/maraton_game.jpg" alt="Maraton tłumaczeniowy z czasem" loading="lazy" />
        </div>
        <div class="game-card" data-game="restaurant" role="listitem">
          <img src="images/restauracja_game.jpg" alt="Symulacja restauracji" loading="lazy" />
        </div>
        <div class="game-card" data-game="fillblank" role="listitem">
          <img src="images/uzupelnij_game.jpg" alt="Uzupełnij zdanie" loading="lazy" />
        </div>
        <div class="game-card" data-game="steps" role="listitem">
          <img src="images/kroki_game.jpg" alt="Ułóż kroki przepisu" loading="lazy" />
        </div>
        <div class="game-card" data-game="guessrecipe" role="listitem">
          <img src="images/zgadnij_game.jpg" alt="Zgadnij przepis ze składników" loading="lazy" />
        </div>
      </div>
    </section>

    <section class="scoreboard" id="scoreboard" aria-label="Tablica wyników">
      <!-- scoreboard loaded via main.js -->
    </section>

    <section id="game-container" role="main" aria-live="polite">
      <!-- dynamic game content inserted here -->
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Bella Cucina – Ucz się włoskiego i odkrywaj smak Italii.</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/game.js"></script>
  <script>
    fetch('data/recipes.json')
      .then((res) => res.json())
      .then((data) => {
        window.recipesData = data;
        if (typeof initGamePage === 'function') {
          initGamePage();
        }
      })
      .catch((err) => console.error('Błąd ładowania danych gry:', err));
  </script>
</body>

</html>
